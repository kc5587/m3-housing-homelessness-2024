[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3-housing-homelessness-2024"
version = "0.1.0"
description = "Team 17571 M3 report archive and selected appendix reconstruction"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2.2", "scikit-learn>=1.5", "scipy>=1.14", "matplotlib>=3.9"]

[project.scripts]
m3-reproduce = "m3_analysis.run:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["m3_analysis"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
